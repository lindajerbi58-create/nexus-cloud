spring.application.name=nexus-cloud-api

server.port=8080
server.address=127.0.0.1

nexus.master.host=localhost
nexus.master.port=1099

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.nexuscloud=INFO

nexus.frontend.origin=http://localhost:3000