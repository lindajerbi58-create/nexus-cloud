name: NEXUS Quality Engineering

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:

    name: Java Backend and API

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test distributed backend
        run: mvn -B -f backend/pom.xml clean install

      - name: Build and test REST API Gateway
        run: mvn -B -f api-gateway/pom.xml clean verify

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            backend/**/target/surefire-reports/
            api-gateway/target/surefire-reports/
            api-gateway/target/failsafe-reports/
          if-no-files-found: warn


  frontend:

    name: Next.js Frontend

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript validation
        working-directory: frontend
        run: npx --no-install tsc --noEmit

      - name: Next.js production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8180/api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Validate chaos controller syntax
        run: node --check tools/chaos-controller.cjs

      - name: Validate integration test syntax
        run: node --check tests/integration/smoke-test.mjs


  integration:

    name: Distributed Integration and Resilience

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check Docker availability
        run: |
          docker --version
          docker compose version

      - name: Execute distributed integration suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node tests/integration/smoke-test.mjs 2>&1 \
            | tee test-results/integration.log

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8180/api \
            -t nexus-frontend-ci:local \
            frontend

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: warn